<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="tissue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)" />

  <g transform="translate(60, 110)">
    <!-- Box Shadow & Body -->
    <rect x="20" y="70" width="240" height="120" rx="20" fill="url(#box)" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)" />
    
    <!-- Box Top Opening Oval -->
    <ellipse cx="140" cy="70" rx="60" ry="16" fill="#E2E8F0" />
    <ellipse cx="140" cy="70" rx="54" ry="12" fill="#0F172A" fill-opacity="0.06" />

    <!-- Tissue Flowing Out -->
    <path d="M 115 70 C 110 30, 95 15, 125 0 C 150 15, 165 35, 165 70 Z" fill="url(#tissue)" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 125 0 C 140 25, 155 45, 140 70" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Label Brand -->
    <rect x="70" y="115" width="140" height="32" rx="8" fill="#ECFDF5" />
    <text x="140" y="136" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#047857" text-anchor="middle" letter-spacing="1">FACIAL TISSUE 2-PLY</text>
  </g>
</svg>
